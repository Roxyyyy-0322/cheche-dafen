<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="七车打分">
<link rel="manifest" href="manifest.webmanifest">
<title>七车打分</title>
<style>
:root{
  --bg:#f2f2f5; --card:#fff; --line:#e3e3e8; --line2:#c8c8ce;
  --txt:#1b1b1f; --txt2:#6b6b70; --txt3:#a3a3aa; --txt4:#c7c7cc;
  --blue:#2f6fed; --blue-l:#eaf1fe;
  --red:#d63b3b; --red-l:#fdecec;
  --amber:#b87300; --amber-l:#fdf3e3;
  --green:#12a05c; --green-l:#e7f6ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
#root{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:.5px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar-in{display:flex;align-items:center;gap:8px;padding:10px 12px}
.tb-title{font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-btn{font-size:13px;color:var(--blue);padding:6px 8px;border-radius:8px;background:var(--blue-l);white-space:nowrap}
.tb-btn.plain{background:none;color:var(--txt2);padding:6px 4px}

/* ---------- car strip ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);
  border-bottom:.5px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--bg);
  border:.5px solid var(--line);font-size:14px;color:var(--txt2);white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:1px}
.chip .dot.out{background:var(--red)}
.chip .dot.done{background:var(--green)}

/* ---------- generic ---------- */
.pad{padding:12px}
.card{background:var(--card);border-radius:12px;border:.5px solid var(--line);margin:0 12px 12px;overflow:hidden}
.sec-h{font-size:13px;color:var(--txt2);padding:14px 14px 7px;font-weight:500}
.muted{color:var(--txt3)}
.small{font-size:12.5px}

/* ---------- header panel ---------- */
.hd{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border-bottom:.5px solid var(--line)}
.ring{position:relative;width:52px;height:52px;flex:0 0 auto}
.ring svg{display:block}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.hd-main{flex:1;min-width:0}
.hd-name{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hd-sub{font-size:12.5px;color:var(--txt2);margin-top:3px}
.hd-score{text-align:right;flex:0 0 auto}
.hd-score .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.hd-score .l{font-size:11px;color:var(--txt3)}

/* ---------- badges ---------- */
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;
  vertical-align:1px;font-weight:500;margin-left:4px}
.tag-gray{background:var(--bg);color:var(--txt2);border:.5px solid var(--line)}
.tag-blue{background:var(--blue-l);color:var(--blue)}
.tag-red{background:var(--red-l);color:var(--red)}
.tag-amber{background:var(--amber-l);color:var(--amber)}
.tag-green{background:var(--green-l);color:var(--green)}
.star{color:var(--amber);font-size:12px;margin-right:2px}

/* ---------- accordion ---------- */
.cat{background:var(--card);border-radius:12px;border:.5px solid var(--line);margin:0 12px 10px;overflow:hidden}
.cat-hd{display:flex;align-items:center;gap:8px;padding:13px 14px;width:100%;text-align:left}
.cat-hd:active{background:var(--bg)}
.cat-nm{font-size:15px;font-weight:600;flex:0 0 auto}
.cat-w{font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums}
.cat-sp{flex:1}
.cat-stat{font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
.cat-stat.pending{color:var(--amber)}
.cat-all{font-size:11.5px;color:var(--green)}
.caret{width:9px;height:9px;border-right:1.6px solid var(--txt4);border-bottom:1.6px solid var(--txt4);
  transform:rotate(45deg);transition:transform .18s;margin-left:2px;flex:0 0 auto}
.cat.open .caret{transform:rotate(-135deg)}
.cat-bd{display:none;border-top:.5px solid var(--line)}
.cat.open .cat-bd{display:block}

/* ---------- item ---------- */
.item{padding:12px 14px;border-bottom:.5px solid var(--line)}
.item:last-child{border-bottom:none}
.item.unrated{background:#fcfcfd}
.item-hd{display:flex;align-items:flex-start;gap:8px}
.item-nm{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.wchip{display:inline-block;font-size:11px;color:var(--txt2);background:var(--bg);
  border:.5px solid var(--line);border-radius:5px;padding:0 5px;margin-left:5px;font-variant-numeric:tabular-nums}
.item-val{flex:0 0 auto;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.item-val.muted{color:var(--txt4);font-size:13px;font-weight:400}
.item-hint{font-size:12px;color:var(--txt2);margin-top:3px;line-height:1.45}
.warn{margin-top:5px;font-size:12px;color:var(--amber);background:var(--amber-l);
  border-radius:7px;padding:6px 8px;line-height:1.45}
.srow{display:flex;align-items:center;gap:8px;margin-top:9px}
.stepbtn{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--bg);
  border:.5px solid var(--line);font-size:19px;line-height:1;color:var(--txt);display:flex;
  align-items:center;justify-content:center;font-weight:500}
.stepbtn:active{background:var(--line)}
.clr{flex:0 0 auto;width:30px;height:34px;font-size:12.5px;color:var(--txt3);border-radius:9px}
.clr:active{background:var(--bg)}
.rng{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:0}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--blue)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.22);margin-top:-10px}
.rng::-moz-range-track{height:4px;border-radius:2px;background:var(--blue)}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
  border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.22)}
.rng.rng-muted::-webkit-slider-runnable-track{background:var(--line2)}
.rng.rng-muted::-moz-range-track{background:var(--line2)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--txt4);
  padding:0 42px 0 42px;margin-top:-4px;font-variant-numeric:tabular-nums}

/* ---------- bottom bar ---------- */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-top:.5px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.bbar-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bbar-l{flex:1;min-width:0}
.bbar-l .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.bbar-l .s{font-size:11.5px;color:var(--txt2)}
.bbar-r{flex:0 0 auto}
.bbtn{background:var(--blue);color:#fff;font-size:14px;padding:9px 16px;border-radius:10px;font-weight:500}
.bbtn.ghost{background:var(--bg);color:var(--txt);border:.5px solid var(--line)}
.spacer{height:72px}

/* ---------- summary ---------- */
.seg{display:flex;gap:0;background:var(--line);border-radius:9px;padding:2px;margin:12px 12px 4px}
.seg button{flex:1;font-size:13.5px;padding:7px 4px;border-radius:7px;color:var(--txt2)}
.seg button.on{background:#fff;color:var(--txt);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.rcard{background:var(--card);border-radius:12px;border:.5px solid var(--line);margin:0 12px 10px;
  padding:13px 14px;display:flex;align-items:center;gap:12px;width:calc(100% - 24px);text-align:left}
.rcard:active{background:#fafafa}
.rcard.out{border-color:#f3c9c9;background:var(--red-l)}
.rk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--txt2)}
.rcard:first-of-type .rk{background:var(--txt);color:#fff}
.rk.out{background:var(--red);color:#fff}
.rmain{flex:1;min-width:0}
.rnm{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rmeta{font-size:11.5px;color:var(--txt2);margin-top:3px;font-variant-numeric:tabular-nums}
.rscore{flex:0 0 auto;text-align:right}
.rscore .n{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.rcard.out .rscore .n{color:var(--red)}
.rscore .d{font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums}
.delta.pos{color:var(--red)}
.delta.neg{color:var(--green)}
.empty{text-align:center;padding:40px 24px;color:var(--txt2);font-size:14px;line-height:1.7}

/* ---------- settings ---------- */
.srow2{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.srow2:last-child{border-bottom:none}
.srow2 .t{flex:1;min-width:0;font-size:14.5px}
.srow2 .t .d{font-size:11.5px;color:var(--txt2);margin-top:2px;line-height:1.45}
.sw{flex:0 0 auto;width:44px;height:27px;border-radius:999px;background:var(--line2);position:relative;transition:background .18s}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.sw.on i{transform:translateX(17px)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:center;border-bottom:.5px solid var(--line);white-space:nowrap}
th{color:var(--txt2);font-weight:500}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
textarea{width:100%;min-height:110px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  border:.5px solid var(--line);border-radius:9px;padding:9px;background:var(--bg);color:var(--txt);
  resize:vertical;box-sizing:border-box}
.alert{background:var(--red-l);color:var(--red);font-size:13px;padding:9px 12px;text-align:center}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:rgba(20,20,22,.9);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   SCHEMA
   ============================================================ */
var VERSION = 2;
var STORE_KEY = 'carscore.v1';
var BASE_CAR = 'xy';           // 星愿 = 兜底基准车
var CORE_W_FULL = 100;         // 核心层权重合计
var EXT_W_FULL  = 27;          // 扩展层权重合计
var CORE_SHARE  = 0.73;        // 完整榜：核心层占比
var EXT_SHARE   = 0.27;        // 完整榜：扩展层占比
var EXT_MIN_RATED = 18;        // 进完整榜的最低扩展项已评数（36 项的一半）
var DEFAULT_SCORE = 3;         // 未打分按 3 分计入
var MUST_MIN = 4;              // 必达项低于此分出局

var CARS = [
  {id:'e5',   name:'银河E5',    brand:'吉利',   tier:'main'},
  {id:'xj7',  name:'星舰7 EV',  brand:'吉利',   tier:'main'},
  {id:'hb06', name:'海豹06EV',  brand:'比亚迪', tier:'main'},
  {id:'b01',  name:'零跑B01',   brand:'零跑',   tier:'main'},
  {id:'b10',  name:'零跑B10',   brand:'零跑',   tier:'main'},
  {id:'xy',   name:'星愿',      brand:'吉利',   tier:'base'},
  {id:'ho',   name:'海鸥',      brand:'比亚迪', tier:'base'}
];

var CATS = [
  {id:'A', name:'造型审美',   w:12},
  {id:'B', name:'空间与日常', w:13},
  {id:'C', name:'动态驾驶',   w:14},
  {id:'D', name:'行驶与三电', w:27.5},
  {id:'E', name:'智能座舱',   w:9},
  {id:'F', name:'预算与成本', w:14.5},
  {id:'G', name:'品牌与服务', w:10}
];

// F3 保险预填值（列序 E5 / 星舰7 / 海豹06 / B01 / B10 / 星愿 / 海鸥）
var INS_PREFILL = {e5:4, xj7:4, hb06:4, b01:3, b10:3, xy:4, ho:4};

var CORE = [
  // A 造型审美 12%
  {id:'A.core.shape',      cat:'A', name:'车型形态契合度', w:2.5, hint:'SUV / 轿车 / 两厢，这个形态契合你的生活吗（装载、上下车）'},
  {id:'A.core.exterior',   cat:'A', name:'外观造型整体',   w:3.5, hint:'站在车外 3 米看，喜不喜欢'},
  {id:'A.core.interior',   cat:'A', name:'内饰设计与质感', w:3.5, hint:'坐进去，看得到摸得到的地方'},
  {id:'A.core.fitfinish',  cat:'A', name:'做工细节',       w:2.5, hint:'缝隙均匀度、按键手感、车内气味'},
  // B 空间与日常 13%
  {id:'B.core.seat',       cat:'B', name:'前排坐姿与座椅舒适', w:4, hint:'调好坐姿，坐 10 分钟腰累不累'},
  {id:'B.core.storage',    cat:'B', name:'前排储物便利',       w:2, hint:'手机放哪、杯子放哪、扶手箱顺不顺手'},
  {id:'B.core.vision',     cat:'B', name:'前排视野',           w:4, hint:'A 柱盲区、看得到车头吗、后视镜视野'},
  {id:'B.core.trunk',      cat:'B', name:'后备箱',             w:3, hint:'容积、开口大小、地台平整度'},
  // C 动态驾驶 14%
  {id:'C.core.accel',      cat:'C', name:'加速响应', w:4, hint:'城市超车、并线有没有信心', need:'drive'},
  {id:'C.core.steering',   cat:'C', name:'转向手感', w:3, hint:'轻重、回正、虚位', need:'drive'},
  {id:'C.core.ride',       cat:'C', name:'滤震舒适', w:4, hint:'细碎颠簸 + 减速带，南京路面为主', need:'drive'},
  {id:'C.core.nvh',        cat:'C', name:'隔音',     w:3, hint:'胎噪 + 风噪，重点是 90km/h 时的感受', need:'drive'},
  // D 行驶与三电 27.5%
  {id:'D.core.stability',  cat:'D', name:'高速直线稳定', w:6,   must:true, need:'drive', hint:'必达项。80–100km/h 直线，车身稳不稳、需不需要不停修正方向'},
  {id:'D.core.lanechange', cat:'D', name:'变道侧倾与车身跟随', w:4.5, need:'drive', hint:'快速变道时侧倾大不大、车跟不跟手'},
  {id:'D.core.brake',      cat:'D', name:'刹车信心', w:6,   must:true, need:'drive', hint:'必达项。踩下去车有没有按你想的停下来（线性度 / 点头 / 停稳平顺）'},
  {id:'D.core.tire',       cat:'D', name:'轮胎规格与原厂胎', w:2,   hint:'胎宽、品牌、是不是低滚阻节能胎'},
  {id:'D.core.safety',     cat:'D', name:'安全配置', w:3.5, hint:'气囊数、AEB、ESP、盲区监测（可现场查参数）'},
  {id:'D.core.range',      cat:'D', name:'续航',     w:2,   hint:'CLTC 标称 + 实际达成率。主要看偶尔跑长途要不要中途补电'},
  {id:'D.core.battery',    cat:'D', name:'电池',     w:2,   hint:'电芯品牌（宁德 / 比亚迪刀片 / 中航等）、容量 kWh、类型、是否 CTB 一体化、低温衰减表现'},
  {id:'D.core.consumption',cat:'D', name:'能耗和风阻', w:1.5, hint:'百公里电耗 kWh/100km + 风阻系数 Cd。低电耗 = 同电池跑更远；低 Cd = 高速省电且风噪小'},
  // E 智能座舱 9%
  {id:'E.core.headunit',   cat:'E', name:'车机流畅度',     w:4, hint:'滑动、切换、冷启动速度'},
  {id:'E.core.voice',      cat:'E', name:'语音助手',       w:2, hint:'唤醒率、听不听得懂、能控什么'},
  {id:'E.core.camera360',  cat:'E', name:'360 影像清晰度', w:3, hint:'画质、畸变、夜间表现（南京老小区窄路、会车也靠它）'},
  // F 预算与成本 14.5%
  {id:'F.core.budgetFit',  cat:'F', name:'预算内配置达成度', w:6, must:true,
    warn:'打的是「12 万内我能买到它的哪个配置，那个配置我满意吗」，不是「这车便宜不便宜」。',
    hint:'必达项。12 万落地内可买到的那个配置，你满意吗'},
  {id:'F.core.insurance',  cat:'F', name:'保险与养车成本', w:4, prefilled:INS_PREFILL,
    hint:'浅灰为报告分，现场问到真实保费就覆盖它'},
  {id:'F.core.resale',     cat:'F', name:'保值预期', w:2,   hint:'三年后大概还能卖多少（品牌 + 保有量判断）'},
  {id:'F.core.price',      cat:'F', name:'价格',     w:2.5,
    warn:'同级别横向比，这台车的定价有没有诚意 —— 不是「这车贵不贵」。按绝对价格打，星愿海鸥必然满分，会污染 12 万档五台车的比较。',
    hint:'同价位里这个定价偏高 / 持平 / 有诚意'},
  // G 品牌与服务 10%
  {id:'G.core.qc',         cat:'G', name:'品控口碑', w:3.5, must:true, hint:'必达项。网上 / 身边人反馈的毛病多不多（自己现场判断）'},
  {id:'G.core.service',    cat:'G', name:'售后网点便利', w:2.5, hint:'南京有几家店，离你多远'},
  {id:'G.core.sales',      cat:'G', name:'销售专业度与态度', w:2, hint:'答不答得上问题、催不催单'},
  {id:'G.core.warranty',   cat:'G', name:'质保', w:2,
    hint:'整车质保 + 三电质保 + 电池衰减更换标准（如「8 年/15 万公里，衰减>30% 免费更换」）'}
];

var EXT = [

var storageOK = true;

catch(e){ storageOK = false; }

function blankState(){
  return { v:VERSION, scores:{}, open:{}, extOn:false, mustOff:{} };
}
var S = load();

function load(){
  var s = null;
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) s = JSON.parse(raw); } catch(e){}
  if (!s || typeof s !== 'object') s = blankState();
  if (!s.scores) s.scores = {};
  if (!s.open) s.open = {};
  if (typeof s.extOn !== 'boolean') s.extOn = false;
  if (!s.mustOff) s.mustOff = {};
  return s;
}
var saveTimer = null;
function save(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 200);
}
function flush(){
  saveTimer = null;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; toast('保存失败：本地存储不可用'); }
}
document.addEventListener('visibilitychange', function(){ if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

/* ============================================================
   CALC
   ============================================================ */
function getScore(carId, itemId){
  var m = S.scores[carId];
  if (m && m[itemId] != null) return { v:m[itemId], src:'user' };
  var it = ITEM[itemId];
  if (it && it.prefilled && it.prefilled[carId] != null) return { v:it.prefilled[carId], src:'report' };
  return { v:null, src:'none' };
}
function effVal(carId, itemId){
  var g = getScore(carId, itemId);
  return g.src === 'none' ? DEFAULT_SCORE : g.v;
}
function setScore(carId, itemId, v){
  if (!S.scores[carId]) S.scores[carId] = {};
  if (v == null) delete S.scores[carId][itemId];
  else S.scores[carId][itemId] = v;
  save();
}
function coreScore(carId){
  var t = 0;
  for (var i=0;i<CORE.length;i++) t += effVal(carId, CORE[i].id) * CORE[i].w;
  return t / 100;
}
function coreRated(carId){
  var n = 0;
  for (var i=0;i<CORE.length;i++) if (getScore(carId, CORE[i].id).src !== 'none') n++;
  return n;
}
function catRated(carId, catId, tier){
  var list = tier === 'ext' ? EXT : CORE, n = 0;
  for (var i=0;i<list.length;i++) if (list[i].cat === catId && getScore(carId, list[i].id).src !== 'none') n++;
  return n;
}
function catCount(catId, tier){
  var list = tier === 'ext' ? EXT : CORE, n = 0;
  for (var i=0;i<list.length;i++) if (list[i].cat === catId) n++;
  return n;
}
function extAgg(carId){
  var num = 0, den = 0, n = 0;
  for (var i=0;i<EXT.length;i++){
    var g = getScore(carId, EXT[i].id);
    if (g.src === 'user'){ num += g.v * EXT[i].w; den += EXT[i].w; n++; }
  }
  if (n === 0) return null;
  return { avg:num/den, n:n, w:den };
}
function fullScore(carId){
  var e = extAgg(carId);
  if (!e) return null;
  return CORE_SHARE * coreScore(carId) + EXT_SHARE * e.avg;
}
function mustItems(){
  return CORE.filter(function(it){
    return it.must && !S.mustOff[it.id];
  });
}
// 出局：必达项已评且 < 4。未评不触发。只约束 12 万档五台车。
function outReasons(carId){
  var car = getCar(carId);
  if (!car || car.tier !== 'main') return [];
  var out = [];
  mustItems().forEach(function(it){
    var g = getScore(carId, it.id);
    if (g.src === 'user' && g.v < MUST_MIN) out.push({ name:it.name, v:g.v });
  });
  return out;
}
function mustPending(carId){
  var car = getCar(carId);
  if (!car || car.tier !== 'main') return [];
  var p = [];
  mustItems().forEach(function(it){
    if (getScore(carId, it.id).src !== 'user') p.push(it.name);
  });
  return p;
}
function getCar(id){
  for (var i=0;i<CARS.length;i++) if (CARS[i].id === id) return CARS[i];
  return null;
}
function board(){
  var baseScore = coreScore(BASE_CAR);
  var rows = CARS.map(function(c){
    var outs = outReasons(c.id);
    return {
      car:c, score:coreScore(c.id), comp:coreRated(c.id),
      out:outs, pending:mustPending(c.id), ext:extAgg(c.id),
      full:fullScore(c.id), delta:coreScore(c.id) - baseScore
    };
  });
  rows.sort(function(a,b){
    if (a.out.length !== b.out.length){
      if (a.out.length === 0) return -1;
      if (b.out.length === 0) return 1;
    }
    return b.score - a.score;
  });
  return rows;
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function fmt(n){
  var s = (Math.round(n*10)/10).toFixed(1);
  return s.replace(/\.0$/,'.0');
}
function ring(pct, size){
  size = size || 52;
  var r = 18, c = 2*Math.PI*r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return '<svg viewBox="0 0 44 44" width="'+size+'" height="'+size+'">'+
    '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="#e3e3e8" stroke-width="4"/>'+
    '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="#2f6fed" stroke-width="4" stroke-linecap="round"'+
    ' stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 22 22)"/>'+
    '</svg>';
}
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
}
function go(hash){ location.hash = hash; }

  var outs = outReasons(carId), pend = mustPending(carId);

  var badges = '';
  if (outs.length) badges += '<span class="tag tag-red">出局 '+outs.map(function(o){return esc(o.name);}).join('、')+'</span>';
  else if (pend.length) badges += '<span class="tag tag-amber">关键项待评</span>';

  var html = '';

    '<button class="tb-btn plain" data-go="#/summary">‹ 汇总</button>'+
    '<div class="tb-title">'+esc(car.name)+'</div>'+
    '<button class="tb-btn plain" data-go="#/settings">设置</button>'+
    '</div></div>';

  // 车型横滑切换条
  html += '<div class="strip">';
  CARS.forEach(function(c){
    var o = outReasons(c.id).length > 0;
    var done = coreRated(c.id) === CORE.length;
    html += '<button class="chip'+(c.id===carId?' on':'')+'" data-go="#/car/'+c.id+'">'+esc(c.name)+
      (o?'<span class="dot out"></span>':(done?'<span class="dot done"></span>':''))+'</button>';
  });
  html += '</div>';

  // 头部面板
  html += '<div class="hd">'+
    '<div class="ring">'+ring(compPct)+'<div class="pct">'+Math.round(compPct*100)+'%</div></div>'+
    '<div class="hd-main">'+
      '<div class="hd-name">'+esc(car.name)+'<span class="tag tag-gray">'+esc(car.brand)+'</span>'+badges+'</div>'+
      '<div class="hd-sub">核心项 '+rated+' / '+CORE.length+
        (S.extOn ? ' · 扩展 '+extAgg(carId).n+' / '+EXT.length : '')+
        (car.tier==='base' ? ' · 兜底基准，不受门槛约束' : '')+
      '</div>'+
    '</div>'+
    '<div class="hd-score"><div class="n">'+fmt(me.score)+'</div><div class="l">第 '+rank+' 名</div></div>'+
  '</div>';

  if (!storageOK) html += '<div class="alert">本地存储不可用（可能处于隐私模式），打分不会被保存</div>';

  // 展开/收起全部
  var allOpen = CATS.every(function(c){ return S.open[c.id]; });

  '</div>';

  CATS.forEach(function(c){
    html += catBlock(carId, c, 'core');
  });

  // 扩展层
  if (S.extOn){
    var ea = extAgg(carId);

      '<div class="sec-h" style="padding:0;flex:1">决胜局细项 36 项 · 合计 27%</div>'+
      '<button class="tb-btn" data-act="extOff">收起</button></div>';

      '<br>已评 '+ea.n+' / '+EXT.length+' 项'+
      (ea.n>0 ? ' · 加权均分 '+fmt(ea.avg) : '')+
      (ea.n>0 && ea.n < EXT_MIN_RATED ? ' · <span style="color:var(--amber)">不足 '+EXT_MIN_RATED+' 项，暂不进完整榜</span>' : '')+
    '</div>';
    CATS.forEach(function(c){
      if (EXT.some(function(it){ return it.cat === c.id; })) html += catBlock(carId, c, 'ext');

function catBlock(carId, cat, tier){
  var list = (tier==='ext'?EXT:CORE).filter(function(it){ return it.cat === cat.id; });
  if (!list.length) return '';
  var open = !!S.open[(tier==='ext'?'x':'c') + cat.id];
  var done = catRated(carId, cat.id, tier), total = list.length;
  var musts = list.filter(function(it){ return it.must && !S.mustOff[it.id]; });
  var mustDone = musts.filter(function(it){ return getScore(carId, it.id).src === 'user'; }).length;
  var stat = done + '/' + total;
  var extra = '';
  if (musts.length){
    extra = ' · ★' + mustDone + '/' + musts.length;
    if (mustDone < musts.length) extra = ' · <span style="color:var(--amber)">★' + mustDone + '/' + musts.length + ' 待评</span>';
  }
  var wsum = list.reduce(function(a,b){ return a + b.w; }, 0);

  var h = '<div class="cat'+(open?' open':'')+'">'+
    '<button class="cat-hd" data-act="tcat" data-cat="'+cat.id+'" data-tier="'+tier+'">'+
      '<span class="cat-nm">'+esc(tier==='ext'?'细项 · ':'')+esc(cat.name)+'</span>'+
      '<span class="cat-w">'+(Math.round(wsum*100)/100)+'%</span>'+
      '<span class="cat-sp"></span>'+
      '<span class="cat-stat'+(musts.length && mustDone<musts.length ? ' pending' : '')+'">'+stat+
        (done===total?' <span class="cat-all">✓</span>':'')+extra+'</span>'+
      '<span class="caret"></span>'+
    '</button>';
  if (open){
    h += '<div class="cat-bd">';
    list.forEach(function(it){ h += itemRow(carId, it, tier); });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function itemRow(carId, it, tier){
  var g = getScore(carId, it.id);
  var rated = g.src !== 'none';
  var v = rated ? g.v : DEFAULT_SCORE;
  var h = '<div class="item'+(rated?'':' unrated')+'" data-item="'+it.id+'">';
  h += '<div class="item-hd"><div class="item-nm">'+
      (it.must && !S.mustOff[it.id] ? '<span class="star">★</span>' : '') + esc(it.name) +
      '<span class="wchip">'+it.w+'%</span>' +
      (g.src==='report' ? '<span class="tag tag-gray">报告分 '+fmt(g.v)+'</span>' : '') +
      (g.src==='user' && it.prefilled ? '<span class="tag tag-blue">已改</span>' : '') +
    '</div>' +
    '<div class="item-val'+(rated?'':' muted')+'" data-role="val">'+(rated?fmt(g.v):'未评')+'</div></div>';
  if (it.warn) h += '<div class="warn">'+esc(it.warn)+'</div>';
  if (it.hint) h += '<div class="item-hint">'+esc(it.hint)+'</div>';
  h += '<div class="srow">'+
      '<button class="stepbtn" data-act="dec" data-id="'+it.id+'">−</button>'+
      '<input type="range" min="0" max="5" step="0.5" value="'+v+'" data-act="rng" data-id="'+it.id+
        '" class="rng'+(rated?'':' rng-muted')+'" aria-label="'+esc(it.name)+' 打分">'+
      '<button class="stepbtn" data-act="inc" data-id="'+it.id+'">+</button>'+
      '<button class="clr" data-act="clr" data-id="'+it.id+'">清</button>'+
    '</div>';
  h += '</div>';
  return h;
}

    '<button class="tb-btn plain" data-go="#/settings">设置</button></div></div>';

  html += '<div class="seg">'+
    '<button class="'+(summaryTab==='core'?'on':'')+'" data-act="tab" data-v="core">核心榜 · 31 项</button>'+
    '<button class="'+(summaryTab==='full'?'on':'')+'" data-act="tab" data-v="full">完整榜 · 决胜局</button>'+
  '</div>';

  if (summaryTab === 'core'){
    html += '<div class="small muted" style="padding:6px 14px 12px;line-height:1.6">'+
      '7 台车同一把尺子（核心层 31 项归一到 100%）。未打分项按 3 分计入。<br>'+
      'Δ星愿 = 比星愿高/低多少分，用来回答「多花的钱值不值」。</div>';
    rows.forEach(function(r, i){ html += rankCard(r, i, base, 'core'); });
  } else {
    var eligible = rows.filter(function(r){ return r.ext && r.ext.n >= EXT_MIN_RATED; });
    html += '<div class="small muted" style="padding:6px 14px 12px;line-height:1.6">'+
      '完整榜 = 核心层 73% + 扩展层 27%，只对扩展项已评满 '+EXT_MIN_RATED+' 项的车显示。'+
      '扩展层按<b>已评项的实际权重归一化</b>，填多填少不会改变话语权。</div>';
    if (eligible.length < 2){
      html += '<div class="empty">目前只有 '+eligible.length+' 台车填够了扩展细项。<br>'+
        '至少给 2 台车各填 '+EXT_MIN_RATED+' 项以上，决胜局才比得起来。</div>';
    }
    eligible.slice().sort(function(a,b){ return b.full - a.full; }).forEach(function(r, i){
      html += rankCard(r, i, base, 'full');
    });
  }

  html += '<div class="spacer"></div>';
  html += '<div class="bbar"><div class="bbar-in">'+
    '<div class="bbar-l"><div class="s" style="font-size:13px">共 '+rows.filter(function(r){return r.comp>0;}).length+' 台已开始打分</div></div>'+
    '<div class="bbar-r"><button class="bbtn" data-go="#/car/'+CARS[0].id+'">去打分</button></div>'+
  '</div></div>';
  return html;
}

function rankCard(r, i, base, mode){
  var score = mode === 'full' ? r.full : r.score;
  var isOut = r.out.length > 0;
  var h = '<button class="rcard'+(isOut?' out':'')+'" data-go="#/car/'+r.car.id+'">';
  h += '<div class="rk'+(isOut?' out':'')+'">'+(isOut?'✕':(i+1))+'</div>';
  h += '<div class="rmain">';
  h += '<div class="rnm">'+esc(r.car.name)+'<span class="tag tag-gray">'+esc(r.car.brand)+'</span>'+
       (r.car.tier==='base'?'<span class="tag tag-green">基准</span>':'')+'</div>';
  var meta = '完成度 '+Math.round(r.comp/CORE.length*100)+'%';
  if (mode === 'full' && r.ext) meta += ' · 扩展 '+r.ext.n+' 项';
  if (isOut) meta += ' · <span style="color:var(--red)">'+r.out.map(function(o){return esc(o.name)+' '+fmt(o.v);}).join('、')+'</span>';
  else if (r.pending.length) meta += ' · <span style="color:var(--amber)">待评：'+esc(r.pending.join('、'))+'</span>';
  h += '<div class="rmeta">'+meta+'</div>';
  h += '</div>';
  h += '<div class="rscore"><div class="n">'+fmt(score)+'</div>';
  if (mode === 'core'){
    if (r.car.id === BASE_CAR) h += '<div class="d">基准</div>';
    else {
      var d = r.delta, cls = d > 0 ? 'pos' : (d < 0 ? 'neg' : '');
      h += '<div class="d delta '+cls+'">Δ星愿 '+(d>0?'+':'')+fmt(d)+'</div>';
    }
  } else {
    h += '<div class="d">完整榜</div>';
  }
  h += '</div></button>';
  return h;
}

/* ============================================================
   RENDER — 设置页
   ============================================================ */
var REPORT_COLS = ['银河E5','星舰7','海豹06','B01','B10','星愿','海鸥'];
var REPORT_ROWS = [
  ['续航补能', [4,4,3,5,5,3,2]],
  ['空间',     [4,5,3,4,4,4,2]],
  ['动力底盘', [4,4,5,5,5,4.5,2.5]],
  ['雨天稳90', [4,4,5,4.5,4,3.5,3]],
  ['品控',     [5,4,5,3,3,5,5]],
  ['售后',     [5,5,5,2,2,4.5,5]],
  ['保险友好', [5,5,5,3,3,5,5]],
  ['车机智能', [5,5,4,5,5,5,4]],
  ['价格性价比',[4,5,4,5,5,5,5]],
  ['综合性价比',[4.3,4.5,4.3,4.2,4.2,4.5,4.0]]
];

function renderSettings(){
  var cw = CORE.reduce(function(a,b){ return a+b.w; }, 0);
  var ew = EXT.reduce(function(a,b){ return a+b.w; }, 0);
  var ok = Math.abs(cw-100) < 1e-9 && Math.abs(ew-27) < 1e-9;

  var html = '<div class="topbar"><div class="topbar-in">'+
    '<button class="tb-btn plain" data-go="#/summary">‹ 返回</button>'+
    '<div class="tb-title">设置</div><span style="width:34px"></span></div></div>';

  html += '<div class="card" style="margin-top:12px">'+
    '<div class="srow2"><div class="t">权重自检'+
      '<div class="d">核心层 '+CORE.length+' 项合计 '+(Math.round(cw*100)/100)+'% · 扩展层 '+EXT.length+' 项合计 '+
      (Math.round(ew*100)/100)+'% '+(ok?'<span class="tag tag-green">通过</span>':'<span class="tag tag-red">异常</span>')+
      '</div></div></div></div>';

  html += '<div class="sec-h">必达项门槛（已评且低于 4 分 → 出局）</div>';
  html += '<div class="card">';
  CORE.filter(function(it){ return it.must; }).forEach(function(it){
    var on = !S.mustOff[it.id];
    html += '<button class="srow2" data-act="must" data-id="'+it.id+'">'+
      '<div class="t">'+esc(it.name)+'<span class="wchip">'+it.w+'%</span>'+
      '<div class="d">'+esc(it.hint||'')+'</div></div>'+
      '<div class="sw'+(on?' on':'')+'"><i></i></div></button>';
  });
  html += '</div>';
  html += '<div class="small muted" style="padding:0 14px 14px;line-height:1.6">'+
    '门槛只约束 12 万档五台车；星愿 / 海鸥只排名不设门槛。<br>未评的必达项<b>不</b>触发出局，只在卡片上标「待评」。</div>';

  html += '<div class="sec-h">数据</div>';
  html += '<div class="card">'+
    '<button class="srow2" data-act="export"><div class="t">导出备份（复制到剪贴板）'+
      '<div class="d">粘到微信收藏即可跨设备恢复</div></div><div class="caret" style="transform:rotate(-45deg)"></div></button>'+
    '<button class="srow2" data-act="import"><div class="t">导入备份（从剪贴板粘贴）'+
      '<div class="d">会覆盖当前所有打分</div></div><div class="caret" style="transform:rotate(-45deg)"></div></button>'+
    '<button class="srow2" data-act="install" id="installBtn"'+(window.__deferredPrompt?'':' style="display:none"')+'>'+
      '<div class="t">安装到主屏幕<div class="d">变成 App 图标，离线也能打开</div></div>'+
      '<div class="caret" style="transform:rotate(-45deg)"></div></button>'+
    '<button class="srow2" data-act="clearcache"><div class="t">清除缓存并刷新'+
      '<div class="d">重部署后页面没更新时点这里</div></div><div class="caret" style="transform:rotate(-45deg)"></div></button>'+
    '<button class="srow2" data-act="clear"><div class="t" style="color:var(--red)">清空所有打分'+
      '<div class="d">不可撤销，请先导出备份</div></div></button>'+
  '</div>';

  html += '<div class="sec-h">报告速查表（不预填，仅供现场参考）</div>';
  html += '<div class="card"><div class="tblwrap"><table><thead><tr><th>维度</th>';
  REPORT_COLS.forEach(function(c){ html += '<th>'+esc(c)+'</th>'; });
  html += '</tr></thead><tbody>';
  REPORT_ROWS.forEach(function(r){
    html += '<tr><td>'+esc(r[0])+'</td>';
    r[1].forEach(function(v){ html += '<td>'+v+'</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';

  html += '<div class="card"><div class="srow2"><div class="t">打分锚点'+
    '<div class="d" style="line-height:1.8">0 不可接受 · 1 明显差 · 2 偏弱但能忍 · 3 及格水平 · 4 满意 · 5 超出预期<br>'+
    '未打分项按 <b>3 分</b> 计入总分，界面标灰显示。</div></div></div></div>';

  html += '<div class="muted small" style="text-align:center;padding:6px 0 2px">七车打分 · v'+VERSION+' · 数据仅存本机</div>';

/* ============================================================
   ROUTER
   ============================================================ */
function currentRoute(){
  var h = location.hash || '#/summary';
  var m = h.match(/^#\/car\/(.+)$/);
  if (m) return { page:'car', carId:m[1] };
  if (h === '#/settings') return { page:'settings' };
  return { page:'summary' };
}
function render(){
  var r = currentRoute();
  var root = document.getElementById('root');
  var html = r.page === 'car' ? renderCar(r.carId)
           : r.page === 'settings' ? renderSettings()
           : renderSummary();
  root.innerHTML = html;
  window.scrollTo(0,0);
}

/* ============================================================
   EVENTS（事件委托）
   ============================================================ */
document.getElementById('root').addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-act]');
  if (!t) return;
  var go2 = t.getAttribute('data-go');
  if (go2){ go(go2); return; }

  var act = t.getAttribute('data-act');
  var r = currentRoute();
  var carId = r.page === 'car' ? r.carId : null;

  if (act === 'tcat'){
    var key = (t.getAttribute('data-tier')==='ext'?'x':'c') + t.getAttribute('data-cat');
    S.open[key] = !S.open[key]; save(); render(); return;
  }
  if (act === 'toggleAll'){
    var v = t.getAttribute('data-v') === '1';
    CATS.forEach(function(c){ S.open['c'+c.id] = v; S.open['x'+c.id] = v; });
    save(); render(); return;
  }
  if (act === 'extOn'){ S.extOn = true; save(); render(); return; }
  if (act === 'extOff'){ S.extOn = false; save(); render(); return; }
  if (act === 'tab'){ summaryTab = t.getAttribute('data-v'); render(); return; }
  if (act === 'must'){
    var id = t.getAttribute('data-id');
    if (S.mustOff[id]) delete S.mustOff[id]; else S.mustOff[id] = true;
    save(); render(); return;
  }
  if (!carId) return;
  if (act === 'inc' || act === 'dec'){
    var id2 = t.getAttribute('data-id');
    var g = getScore(carId, id2);
    var cur = g.src === 'none' ? DEFAULT_SCORE : g.v;
    var nv = act === 'inc' ? cur + 0.5 : cur - 0.5;
    nv = Math.max(0, Math.min(5, Math.round(nv*10)/10));
    setScore(carId, id2, nv); render(); return;
  }
  if (act === 'clr'){
    setScore(carId, t.getAttribute('data-id'), null); render(); return;
  }
  if (act === 'export'){ doExport(); return; }
  if (act === 'import'){ doImport(); return; }
  if (act === 'clear'){
    if (confirm('确定清空所有打分？此操作不可撤销。')){
      S.scores = {}; flush(); toast('已清空'); render();
    }
    return;
  }
  if (act === 'install'){
    if (window.__deferredPrompt){
      window.__deferredPrompt.prompt();
      window.__deferredPrompt.userChoice.then(function(){ window.__deferredPrompt = null; });
    }
    return;
  }
  if (act === 'clearcache'){
    if ('serviceWorker' in navigator){
      caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }).then(function(){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(r){ r.unregister(); });
          location.reload();
        });
      });
    } else { location.reload(); }
    return;
  }
});

// 滑块：拖动时只更新局部 DOM，避免整页重渲染导致拖动中断
document.getElementById('root').addEventListener('input', function(e){
  var t = e.target;
  if (!t.getAttribute) return;
  if (t.getAttribute('data-act') !== 'rng') return;
  var r = currentRoute();
  if (r.page !== 'car') return;
  var carId = r.carId, id = t.getAttribute('data-id');
  var v = Math.max(0, Math.min(5, Math.round(parseFloat(t.value)*10)/10));
  setScore(carId, id, v);
  // 局部刷新：当前项 + 该大类的计数 + 顶部环形 + 底部条
  var item = t.closest('.item');
  if (item){
    item.classList.remove('unrated');
    var val = item.querySelector('[data-role="val"]');
    if (val){ val.textContent = fmt(v); val.classList.remove('muted'); }
    t.classList.remove('rng-muted');
    var hd = item.querySelector('.item-nm');
    if (hd && ITEM[id].prefilled){
      var tag = hd.querySelector('.tag-gray');
      if (tag) tag.remove();
      if (!hd.querySelector('.tag-blue')){
        var sp = document.createElement('span');
        sp.className = 'tag tag-blue'; sp.textContent = '已改';
        hd.appendChild(sp);
      }
    }
  }
  refreshMeta(carId);
});

function refreshMeta(carId){
  var rows = board();
  var me = null, rank = 0;
  for (var i=0;i<rows.length;i++) if (rows[i].car.id === carId){ me = rows[i]; rank = i+1; break; }
  var compPct = coreRated(carId) / CORE.length;
  // 环形
  var pctEl = document.querySelector('.ring .pct');
  var svgEl = document.querySelector('.ring');
  if (pctEl) pctEl.textContent = Math.round(compPct*100) + '%';
  if (svgEl) svgEl.innerHTML = ring(compPct);
  var sub = document.querySelector('.hd-sub');
  if (sub) sub.innerHTML = '核心项 ' + coreRated(carId) + ' / ' + CORE.length +
      (S.extOn ? ' · 扩展 ' + extAgg(carId).n + ' / ' + EXT.length : '') +
      (getCar(carId).tier==='base' ? ' · 兜底基准，不受门槛约束' : '');
  var n1 = document.querySelector('.hd-score .n'), n2 = document.querySelector('.hd-score .l');
  if (n1) n1.textContent = fmt(me.score);
  if (n2) n2.textContent = '第 ' + rank + ' 名';
  // 大类计数
  CATS.forEach(function(c){
    var btns = document.querySelectorAll('.cat-hd[data-cat="'+c.id+'"]');
    btns.forEach(function(b){
      var tier = b.getAttribute('data-tier');
      var done = catRated(carId, c.id, tier), total = catCount(c.id, tier);
      var musts = (tier==='ext'?EXT:CORE).filter(function(it){ return it.cat===c.id && it.must && !S.mustOff[it.id]; });
      var mustDone = musts.filter(function(it){ return getScore(carId, it.id).src==='user'; }).length;
      var st = b.querySelector('.cat-stat');
      if (!st) return;
      var extra = '';
      if (musts.length){
        extra = mustDone < musts.length
          ? ' · <span style="color:var(--amber)">★'+mustDone+'/'+musts.length+' 待评</span>'
          : ' · ★'+mustDone+'/'+musts.length;
      }
      st.innerHTML = done+'/'+total+(done===total?' <span class="cat-all">✓</span>':'')+extra;
      st.className = 'cat-stat' + (musts.length && mustDone<musts.length ? ' pending' : '');
    });
  });
  // 底部条
  var b1 = document.querySelector('.bbar-l .n'), b2 = document.querySelector('.bbar-l .s');
  if (b1) b1.textContent = fmt(me.score);
  if (b2) b2.textContent = '第 '+rank+' 名 / 7 · 完成度 '+Math.round(compPct*100)+'%'+
      (S.extOn && me.full!=null ? ' · 完整榜 '+fmt(me.full) : '');
}

/* ============================================================
   导出 / 导入
   ============================================================ */
function doExport(){
  var payload = { v:VERSION, app:'carscore', savedAt:new Date().toISOString(), data:S };
  var txt = JSON.stringify(payload);
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    toast(ok ? '已复制到剪贴板' : '复制失败，请手动选择下方文本');
    if (!ok) showTextarea(txt);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); }, fallback);
  } else fallback();
}
function showTextarea(txt){
  var d = document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML='<div style="background:#fff;border-radius:14px;padding:16px;width:100%;max-width:480px">'+
    '<div style="font-weight:600;margin-bottom:8px">手动复制</div>'+
    '<textarea id="__ta" style="min-height:180px"></textarea>'+
    '<button id="__ok" style="margin-top:10px;width:100%;background:#2f6fed;color:#fff;padding:10px;border-radius:10px">关闭</button></div>';
  document.body.appendChild(d);
  d.querySelector('#__ta').value = txt;
  d.querySelector('#__ok').onclick = function(){ document.body.removeChild(d); };
}
function doImport(){
  var txt = prompt('粘贴之前导出的备份 JSON：');
  if (!txt) return;
  try {
    var o = JSON.parse(txt);
    var d = o && o.data ? o.data : o;
    if (!d || typeof d !== 'object' || !d.scores) throw new Error('格式不对');
    S = { v:VERSION, scores:d.scores||{}, open:d.open||{}, extOn:!!d.extOn, mustOff:d.mustOff||{} };
    flush(); toast('导入成功'); render();
  } catch(e){ toast('导入失败：' + e.message); }
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('hashchange', render);
if (!location.hash) location.hash = '#/summary';
render();

/* ---- PWA：注册 Service Worker（仅 http/https，file:// 忽略）---- */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('SW 注册失败', err); });
  });
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    window.__deferredPrompt = e;
    var btn = document.getElementById('installBtn');
    if (btn) btn.style.display = '';
  });
  window.addEventListener('appinstalled', function(){ window.__deferredPrompt = null; });
}
if (!storageOK){
  var a = document.createElement('div');
  a.className = 'alert';
  a.textContent = '本地存储不可用（可能处于隐私模式），本次打分不会被保存';
  document.getElementById('root').insertBefore(a, document.getElementById('root').firstChild);
}
